name: unstick-pages
on:
  push:
    paths: ['.github/workflows/unstick-pages.yml']
permissions:
  pages: write
  contents: read
  deployments: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and cancel stuck Pages deployment
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          H=(-H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          for id in c502cb6b0990f93802a956c1315520ad4bcb2370 7470635384; do
            echo "== GET $id"; curl -sS "${H[@]}" "https://api.github.com/repos/$R/pages/deployments/$id" -w "\nHTTP %{http_code}\n"
            echo "== CANCEL $id"; curl -sS -X POST "${H[@]}" "https://api.github.com/repos/$R/pages/deployments/$id/cancel" -w "\nHTTP %{http_code}\n"
            echo "== GET after $id"; curl -sS "${H[@]}" "https://api.github.com/repos/$R/pages/deployments/$id" -w "\nHTTP %{http_code}\n"
          done
          echo "== builds"; curl -sS "${H[@]}" "https://api.github.com/repos/$R/pages/builds?per_page=5" | head -c 1500
