name: unstick-pages
on:
  push:
    paths: ['.github/workflows/unstick-pages.yml']
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployment
        run: |
          for id in c502cb6b0990f93802a956c1315520ad4bcb2370; do
            curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$id/cancel" -w "\nHTTP %{http_code}\n"
          done
          curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/pages" | head -c 800
